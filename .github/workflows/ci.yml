name: CI

# CI PAUSED: manual trigger only until the full check suite lands with the
# push/PR triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Biome CI
        run: bunx biome ci .
      - name: Run TypeScript
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun test

  dist-smoke:
    name: Dist smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
    env:
      QUEST_TARGET: ${{ matrix.target }}
      QUEST_VERSION: 0.0.0-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build target artifact
        run: bun run scripts/dist.ts
      - name: Verify target artifact
        run: bun run scripts/verify-dist.ts
      - name: Smoke fresh install from PATH
        run: bun run scripts/install-smoke.ts
