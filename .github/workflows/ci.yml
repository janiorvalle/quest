name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci .
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun run test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        if: runner.os != 'Windows'
        run: make check
      - name: Check without make
        # The Windows runner image ships no make; bun run check expands to the
        # same lint, typecheck, and test sequence as the Makefile target.
        if: runner.os == 'Windows'
        run: bun run check
      # Keep the required Build (...) checks stable while exercising each
      # installer on its native runner. Installer smoke remains the full
      # cross-target distribution gate below.
      - name: Build native artifact
        run: bun run scripts/dist.ts
        env:
          QUEST_TARGET: ${{ matrix.target }}
          QUEST_VERSION: 0.0.0-ci
      - name: Verify native artifact
        run: bun run scripts/verify-dist.ts
        env:
          QUEST_TARGET: ${{ matrix.target }}
          QUEST_VERSION: 0.0.0-ci
      - name: Exercise native installer
        run: bun run scripts/install-smoke.ts
        env:
          QUEST_TARGET: ${{ matrix.target }}
          QUEST_VERSION: 0.0.0-ci

  install-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # QUEST_TARGET stays unset so this is the same gate CONTRIBUTING.md names:
      # cross-compile and checksum-verify every distribution target, then run
      # the checksum-verifying installer against the host artifact.
      - name: Build every target and exercise the installer
        run: bun run dist:smoke

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          persona: pedantic
          min-severity: low
          advanced-security: false

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      pull-requests: read # gitleaks scopes pull request commits
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the scan covers every commit, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      # No GITLEAKS_LICENSE: gitleaks-action requires a license key only for
      # repositories owned by an organization account, and this repository is
      # owned by a personal account.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
