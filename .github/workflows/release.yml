name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v, for example 0.24.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write # reserve a manual release tag before building
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag_created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::manual releases must run from the protected main branch; select main in the Actions form before retrying"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            raw_version="$REF_NAME"
          else
            raw_version="$INPUT_VERSION"
          fi

          release_version="${raw_version#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::release version must be a semantic version such as 0.24.0 or 0.24.0-beta.1"
            exit 1
          fi

          version_without_build="${release_version%%+*}"
          prerelease=false
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          fi

          {
            printf 'tag=v%s\n' "$release_version"
            printf 'version=%s\n' "$release_version"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Reject an existing release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          release_list="$RUNNER_TEMP/quest-release-list"
          if ! gh api --paginate --slurp --method GET "repos/$GH_REPO/releases?per_page=100" >"$release_list" 2>&1; then
            echo "::error::could not verify whether GitHub release $RELEASE_TAG exists; retry the release after GitHub API access recovers"
            cat "$release_list"
            exit 1
          fi
          if jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length > 0' "$release_list" >/dev/null; then
            echo "::error::GitHub release $RELEASE_TAG already exists; choose a new version or remove the old release before retrying"
            exit 1
          fi

      - name: Reject an existing manual tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            exit 0
          fi

          probe_file="$RUNNER_TEMP/quest-tag-probe"
          set +e
          gh api --include --silent "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >"$probe_file" 2>&1
          probe_exit=$?
          set -e
          http_status="$(awk '$1 ~ /^HTTP\/[0-9]+(\.[0-9]+)?$/ { status = $2 } END { print status }' "$probe_file")"

          if [[ "$http_status" == "404" ]]; then
            exit 0
          fi
          if [[ "$probe_exit" -ne 0 || "$http_status" != "200" ]]; then
            echo "::error::could not verify whether Git tag $RELEASE_TAG exists; retry the release after GitHub API access recovers"
            cat "$probe_file"
            exit 1
          fi
          if [[ "$http_status" == "200" ]]; then
            echo "::error::Git tag $RELEASE_TAG already exists; push that tag to release it or choose a new version"
            exit 1
          fi

      - name: Reserve manual release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response_file="$RUNNER_TEMP/quest-tag-create"
          set +e
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$TARGET_SHA" >"$response_file" 2>&1
          create_exit=$?
          set -e
          if [[ "$create_exit" -ne 0 ]]; then
            echo "::error::could not reserve Git tag $RELEASE_TAG at $TARGET_SHA; another release may own it, or GitHub API access may be unavailable"
            cat "$response_file"
            exit 1
          fi
          echo 'created=true' >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publish the GitHub release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build release artifacts
        env:
          QUEST_RELEASE: "1"
          QUEST_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run scripts/dist.ts
      - name: Verify release artifacts
        env:
          QUEST_RELEASE: "1"
          QUEST_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run scripts/verify-dist.ts
      - name: Publish GitHub release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_MARKER: quest-release-${{ github.run_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          release_args=(
            "$RELEASE_TAG"
            --title "quest $RELEASE_TAG"
            --notes "$RELEASE_MARKER"
            --generate-notes
            --draft
          )
          release_args+=(--verify-tag)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "${release_args[@]}" dist/* install.sh install.ps1
          gh release edit "$RELEASE_TAG" --draft=false

  published_installer_smoke:
    name: Smoke-test published installer
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # download the published release assets
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install from the published release
        env:
          QUEST_GITHUB_TOKEN: ${{ github.token }}
          QUEST_INSTALL_DIR: ${{ runner.temp }}/quest-install
          QUEST_INSTALL_REPO: ${{ github.repository }}
          QUEST_INSTALL_TAG: ${{ needs.prepare.outputs.tag }}
          QUEST_INSTALL_VERSION: ${{ needs.prepare.outputs.version }}
        run: sh install.sh

  cleanup_failed_release:
    name: Remove incomplete publication
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result != 'success' || needs.published_installer_smoke.result != 'success') }}
    needs:
      - prepare
      - publish
      - published_installer_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # remove a release whose publication or smoke test failed
    steps:
      - name: Delete incomplete GitHub release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MARKER: quest-release-${{ github.run_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TAG_CREATED: ${{ needs.prepare.outputs.tag_created }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_list="$RUNNER_TEMP/quest-release-cleanup-list"
          if ! gh api --paginate --slurp --method GET "repos/$GH_REPO/releases?per_page=100" >"$release_list" 2>&1; then
            echo "::error::could not verify incomplete GitHub release $RELEASE_TAG; refusing cleanup until GitHub API access recovers"
            cat "$release_list"
            exit 1
          fi

          release_exists="$(jq -r --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length > 0' "$release_list")"
          release_id="$(jq -r --arg tag "$RELEASE_TAG" --arg marker "$RELEASE_MARKER" '[.[][] | select(.tag_name == $tag) | select((.body // "") | contains($marker)) | .id] | first // empty' "$release_list")"

          if [[ "$release_exists" != "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "No published release $RELEASE_TAG found; nothing to clean up"
              exit 0
            fi

            tag_probe="$RUNNER_TEMP/quest-tag-cleanup-probe"
            set +e
            gh api --include --silent "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >"$tag_probe" 2>&1
            tag_probe_exit=$?
            set -e
            tag_http_status="$(awk '$1 ~ /^HTTP\/[0-9]+(\.[0-9]+)?$/ { status = $2 } END { print status }' "$tag_probe")"

            if [[ "$tag_http_status" == "404" ]]; then
              echo "No published release or generated tag $RELEASE_TAG found; nothing to clean up"
            elif [[ "$tag_probe_exit" -ne 0 || "$tag_http_status" != "200" ]]; then
              echo "::error::could not verify whether generated Git tag $RELEASE_TAG exists; refusing cleanup"
              cat "$tag_probe"
              exit 1
            elif [[ "$TAG_CREATED" != "true" ]]; then
              echo "Git tag $RELEASE_TAG was not created by this run; leaving it in place"
            elif [[ "$(gh api --silent "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" != "$TARGET_SHA" ]]; then
              echo "Git tag $RELEASE_TAG no longer points at this run's commit; leaving it in place"
            else
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" >/dev/null
              echo "Deleted generated Git tag $RELEASE_TAG"
            fi
            exit 0
          fi

          if [[ -z "$release_id" ]]; then
            echo "Release $RELEASE_TAG was not created by this workflow run; leaving it in place"
            exit 0
          fi

          gh api --method DELETE "repos/$GH_REPO/releases/$release_id" >/dev/null
          if [[ "$TAG_CREATED" == "true" ]]; then
            tag_sha="$(gh api --silent "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$tag_sha" == "$TARGET_SHA" ]]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" >/dev/null
              echo "Deleted generated Git tag $RELEASE_TAG"
            else
              echo "Git tag $RELEASE_TAG changed or disappeared; leaving it in place"
            fi
          fi
          echo "Deleted incomplete release $RELEASE_TAG created by $RELEASE_MARKER"
